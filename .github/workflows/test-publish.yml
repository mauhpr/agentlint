name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build test distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv python install 3.13
      - run: uv sync --extra dev --frozen --python 3.13
      - run: uv run pytest -q
      - run: uv build
      - run: |
          uv venv --seed .test-wheel-venv
          uv pip install --python .test-wheel-venv/bin/python dist/*.whl
          .test-wheel-venv/bin/agentlint --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Trusted test publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agentlint
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
